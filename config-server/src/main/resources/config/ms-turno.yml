server:
  port: 8084


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/turno_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  info:
    app:
      name: ms-turno
      description: Microservicio destinado a la gestion de turnos
      version: 1.0.0

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

      compression:
        request:
          enabled: true
        response:
          enabled: true
logging:
  level:
    com.veterinaria.turno.adapter.out.feign: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      mascotaService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED

      veterinarioService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED

  retry:
    instances:
      mascotaService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

      veterinarioService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents

  endpoint:
    health:
      show-details: always

  health:
    circuitbreakers:
      enabled: true