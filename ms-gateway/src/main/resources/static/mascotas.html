<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Mascotas - VetSystem</title>


    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<!-- ============================================ -->
<!-- NAVBAR -->
<!-- ============================================ -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html"
        >
            VetSystem
        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarVet"
        >
            <span class="navbar-toggler-icon"></span>
        </button>


        <div
            class="collapse navbar-collapse"
            id="navbarVet"
        >

            <ul class="navbar-nav ms-auto">


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="duenios.html"
                    >
                        Dueños
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="mascotas.html"
                    >
                        Mascotas
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="veterinarios.html"
                    >
                        Veterinarios
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="turnos.html"
                    >
                        Turnos
                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- ============================================ -->
<!-- CONTENIDO -->
<!-- ============================================ -->

<main class="container py-4">


    <!-- CABECERA -->

    <div
        class="d-flex
               justify-content-between
               align-items-center
               mb-4"
    >

        <div>

            <h1 class="h3 mb-1">
                Mascotas
            </h1>

            <p class="text-muted mb-0">
                Gestión de mascotas registradas
            </p>

        </div>


        <button
            type="button"
            class="btn btn-primary"
            id="btnNuevaMascota"
        >
            + Nueva mascota
        </button>

    </div>



    <!-- ALERTAS -->

    <div
        id="alerta"
        class="d-none"
        role="alert"
    ></div>


<!-- ============================================ -->
<!-- BUSCADOR POR ID -->
<!-- ============================================ -->

<div class="card shadow-sm mb-4">

    <div class="card-body">

        <div class="row g-2 align-items-end">

            <div class="col-md-6">

                <label
                    for="buscarMascotaId"
                    class="form-label"
                >
                    Buscar mascota por ID
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="buscarMascotaId"
                    placeholder="Ingrese el ID"
                    min="1"
                >

            </div>

            <div class="col-md-auto">

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btnBuscarMascota"
                >
                    Buscar
                </button>

            </div>

            <div class="col-md-auto">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnMostrarTodasMascotas"
                >
                    Mostrar todas
                </button>

            </div>

        </div>

    </div>

</div>
    <!-- ============================================ -->
    <!-- TABLA -->
    <!-- ============================================ -->

    <div class="card shadow-sm">

        <div class="card-body p-0">


            <div class="table-responsive">

                <table
                    class="table
                           table-hover
                           align-middle
                           mb-0"
                >


                    <thead class="table-light">

                        <tr>

                            <th>ID</th>

                            <th>Nombre</th>

                            <th>Especie</th>

                            <th>Raza</th>

                            <th>Fecha nacimiento</th>

                            <th>Dueño</th>

                            <th class="text-end">
                                Acciones
                            </th>

                        </tr>

                    </thead>



                    <tbody id="tablaMascotas">

                    </tbody>


                </table>

            </div>


        </div>

    </div>



    <!-- SIN MASCOTAS -->

    <div
        id="sinMascotas"
        class="alert alert-secondary mt-3 d-none"
    >
        No hay mascotas registradas.
    </div>


</main>



<!-- ============================================ -->
<!-- MODAL NUEVA / EDITAR MASCOTA -->
<!-- ============================================ -->

<div
    class="modal fade"
    id="modalMascota"
    tabindex="-1"
    aria-hidden="true"
>


    <div class="modal-dialog">


        <div class="modal-content">


            <form id="formMascota">


                <!-- HEADER -->

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="tituloModalMascota"
                    >
                        Registrar nueva mascota
                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>

                </div>



                <!-- BODY -->

                <div class="modal-body">


                    <!-- ERROR -->

                    <div
                        id="errorFormMascota"
                        class="alert alert-danger d-none"
                    ></div>



                    <!-- NOMBRE -->

                    <div class="mb-3">

                        <label
                            for="mascotaNombre"
                            class="form-label"
                        >
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="mascotaNombre"
                            required
                        >

                    </div>



                    <!-- ESPECIE -->

                    <div class="mb-3">

                        <label
                            for="mascotaEspecie"
                            class="form-label"
                        >
                            Especie
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="mascotaEspecie"
                            placeholder="Ej: Perro"
                            required
                        >

                    </div>



                    <!-- RAZA -->

                    <div class="mb-3">

                        <label
                            for="mascotaRaza"
                            class="form-label"
                        >
                            Raza
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="mascotaRaza"
                            placeholder="Ej: Labrador"
                        >

                    </div>



                    <!-- FECHA -->

                    <div class="mb-3">

                        <label
                            for="mascotaFechaNacimiento"
                            class="form-label"
                        >
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="mascotaFechaNacimiento"
                            required
                        >

                    </div>



                    <!-- DUEÑO -->

                    <div class="mb-3">

                        <label
                            for="mascotaDuenio"
                            class="form-label"
                        >
                            Dueño
                        </label>

                        <select
                            class="form-select"
                            id="mascotaDuenio"
                            required
                        >

                            <option value="">
                                Seleccione un dueño...
                            </option>

                        </select>

                    </div>


                </div>



                <!-- FOOTER -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnGuardarMascota"
                    >
                        Guardar
                    </button>

                </div>


            </form>


        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- JS Mascotas -->

<script src="js/mascotas.js"></script>


</body>

</html>
