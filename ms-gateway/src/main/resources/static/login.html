<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar | VetSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center">
<main class="container" style="max-width: 450px">
  <section class="card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-2">VetSystem</h1>
      <p class="text-secondary mb-4">Iniciar sesion para gestionar la veterinaria</p>
      <form id="login-form">
        <div class="mb-3"><label for="username" class="form-label">Usuario</label><input id="username" class="form-control" autocomplete="username" required></div>
        <div class="mb-3"><label for="password" class="form-label">Contrasena</label><input id="password" type="password" class="form-control" autocomplete="current-password" required></div>
        <div class="alert alert-danger d-none" id="login-error" role="alert"></div>
        <button class="btn btn-primary w-100" id="login-button" type="submit">Ingresar</button>
      </form>
      <p class="small text-secondary mt-4 mb-0">El alta de usuarios se realiza desde la API de autenticacion.</p>
    </div>
  </section>
</main>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
