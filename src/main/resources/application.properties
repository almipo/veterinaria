spring.application.name=vet_system
spring.datasource.url=jdbc:mysql://localhost:3306/vet_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#cambio update por create por una cuestion de desarrolo, para que pueda usar el mismo ejemplo
spring.jpa.hibernate.ddl-auto= update
