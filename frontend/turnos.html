<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turnos - VetSystem</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">VetSystem</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="duenios.html">Dueños</a>
            <a class="nav-link" href="mascotas.html">Mascotas</a>
            <a class="nav-link" href="veterinarios.html">Veterinarios</a>
            <a class="nav-link active" href="turnos.html">Turnos</a>
        </div>
    </div>
</nav>


<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Turnos</h1>
            <p class="text-muted mb-0">Gestión de turnos veterinarios</p>
        </div>

        <button
            class="btn btn-success"
            data-bs-toggle="modal"
            data-bs-target="#modalTurno"
        >
            + Nuevo turno
        </button>
    </div>


    <div id="alerta" class="alert d-none"></div>


    <!-- BUSCAR -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-2">

                <div class="col-md-4">
                    <input
                        type="number"
                        id="buscarTurnoId"
                        class="form-control"
                        placeholder="Buscar turno por ID"
                    >
                </div>

                <div class="col-md-auto">
                    <button
                        id="btnBuscarTurno"
                        class="btn btn-primary"
                    >
                        Buscar
                    </button>
                </div>

                <div class="col-md-auto">
                    <button
                        id="btnMostrarTodos"
                        class="btn btn-secondary"
                    >
                        Mostrar todos
                    </button>
                </div>

            </div>
        </div>
    </div>


    <!-- TABLA -->
    <div class="table-responsive">
        <table class="table table-striped table-hover bg-white shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Dueño</th>
                <th>Mascota</th>
                <th>Veterinario</th>
                <th>Motivo</th>
                <th>Estado</th>
                <th>Observaciones</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody id="tablaTurnos"></tbody>
        </table>
    </div>

    <p id="sinTurnos" class="text-muted d-none">
        No hay turnos registrados.
    </p>

</main>


<!-- MODAL NUEVO TURNO -->
<div class="modal fade" id="modalTurno" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form id="formTurno">

                <div class="modal-header">
                    <h5 class="modal-title">Nuevo turno</h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>

                <div class="modal-body">

                    <div id="errorTurno" class="alert alert-danger d-none"></div>


                    <div class="mb-3">
                        <label class="form-label">Mascota</label>

                        <select
                            id="turnoMascota"
                            class="form-select"
                            required
                        >
                            <option value="">Seleccione una mascota</option>
                        </select>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Veterinario</label>

                        <select
                            id="turnoVeterinario"
                            class="form-select"
                            required
                        >
                            <option value="">Seleccione un veterinario</option>
                        </select>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Fecha</label>

                        <input
                            type="date"
                            id="turnoFecha"
                            class="form-control"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Hora</label>

                        <input
                            type="time"
                            id="turnoHora"
                            class="form-control"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Motivo</label>

                        <textarea
                            id="turnoMotivo"
                            class="form-control"
                            rows="3"
                            required
                        ></textarea>
                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Guardar turno
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>


<!-- MODAL CAMBIAR ESTADO -->
<div class="modal fade" id="modalEstado" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form id="formEstado">

                <div class="modal-header">
                    <h5 class="modal-title">Actualizar estado</h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" id="estadoTurnoId">


                    <div class="mb-3">
                        <label class="form-label">Estado</label>

                        <select
                            id="nuevoEstado"
                            class="form-select"
                            required
                        >
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="CONFIRMADO">Confirmado</option>
                            <option value="EN_CURSO">En curso</option>
                            <option value="FINALIZADO">Finalizado</option>
                            <option value="CANCELADO">Cancelado</option>
                        </select>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>

                        <textarea
                            id="observacionesEstado"
                            class="form-control"
                            rows="3"
                        ></textarea>
                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Actualizar
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script src="js/turnos.js"></script>

</body>
</html>
