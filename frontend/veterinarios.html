<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinarios - VetSystem</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">VetSystem</a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarVet"
            aria-controls="navbarVet"
            aria-expanded="false"
            aria-label="Mostrar navegación"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarVet">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="duenios.html">Dueños</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="mascotas.html">Mascotas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="veterinarios.html">
                        Veterinarios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="turnos.html">Turnos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Veterinarios</h1>
            <p class="text-muted mb-0">Gestión de veterinarios</p>
        </div>

        <button
            type="button"
            class="btn btn-primary"
            id="btnNuevoVeterinario"
        >
            + Nuevo veterinario
        </button>
    </div>

    <div id="alerta" class="d-none" role="alert"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label for="buscarVeterinarioId" class="form-label">
                        Buscar veterinario por ID
                    </label>
                    <input
                        type="number"
                        class="form-control"
                        id="buscarVeterinarioId"
                        placeholder="Ingrese el ID"
                        min="1"
                    >
                </div>

                <div class="col-md-auto">
                    <button
                        type="button"
                        class="btn btn-primary"
                        id="btnBuscarVeterinario"
                    >
                        Buscar
                    </button>
                </div>

                <div class="col-md-auto">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="btnMostrarTodosVeterinarios"
                    >
                        Mostrar todos
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Matrícula</th>
                            <th>Especialidad</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVeterinarios"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="sinVeterinarios" class="alert alert-secondary mt-3 d-none">
        No hay veterinarios registrados.
    </div>

</main>

<div
    class="modal fade"
    id="modalVeterinario"
    tabindex="-1"
    aria-labelledby="tituloModalVeterinario"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <form id="formVeterinario">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalVeterinario">
                        Registrar nuevo veterinario
                    </h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>
                </div>

                <div class="modal-body">

                    <div
                        id="errorFormVeterinario"
                        class="alert alert-danger d-none"
                        role="alert"
                    ></div>

                    <div class="mb-3">
                        <label for="veterinarioNombre" class="form-label">Nombre</label>
                        <input
                            type="text"
                            class="form-control"
                            id="veterinarioNombre"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="veterinarioApellido" class="form-label">Apellido</label>
                        <input
                            type="text"
                            class="form-control"
                            id="veterinarioApellido"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="veterinarioMatricula" class="form-label">Matrícula</label>
                        <input
                            type="text"
                            class="form-control"
                            id="veterinarioMatricula"
                            placeholder="MN-1234"
                            pattern="MN-[0-9]{4}"
                            title="La matrícula debe tener el formato MN-XXXX"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="veterinarioEspecialidad" class="form-label">
                            Especialidad
                        </label>
                        <select
                            class="form-select"
                            id="veterinarioEspecialidad"
                            required
                        >
                            <option value="">Seleccione una especialidad</option>
                            <option value="clínica_general">Clínica General</option>
                            <option value="dermatología">Dermatología</option>
                            <option value="cirugía">Cirugía</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="veterinarioEmail" class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            id="veterinarioEmail"
                            placeholder="nombre@ejemplo.com"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="veterinarioTelefono" class="form-label">Teléfono</label>
                        <input
                            type="number"
                            class="form-control"
                            id="veterinarioTelefono"
                            min="1"
                            placeholder="123456789"
                        >
                    </div>

                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnGuardarVeterinario"
                    >
                        Guardar
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/veterinarios.js"></script>

</body>
</html>
